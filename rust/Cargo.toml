[package]
name = "rust_lib_sftp_client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
async-stream = "0.3.6"
flutter_rust_bridge = "=2.13.0"
local-ip-address = "0.6.13"
once_cell = "1.21.4"
russh = "0.63.2"
russh-sftp = "2.4.0"
ssh-key = "0.6.7"
tokio = { version = "1.53.1", features = ["full"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
